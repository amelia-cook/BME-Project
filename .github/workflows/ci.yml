name: Zephyr CI

on:
  push:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gpio: ${{ steps.filter.outputs.gpio }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gpio:
              - 'gpio_lab/**'
  
  
  gpio_tests:
    needs: changes
    if: needs.changes.outputs.gpio == 'true'
    runs-on: ubuntu-latest
    container:
      image: hardwario/nrf-connect-sdk-build:v2.9.0-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: West init
        run: |
          cd gpio_lab
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.7.0
          west update -o=--depth=1 -n
      
      - name: Check code specs
        run: |
          set -e
          cd gpio_lab
          grep -Eq '#define[[:space:]]+LED_BLINK_FREQ_HZ[[:space:]]+2' src/main.c
          grep -Eq '#define[[:space:]]+FREQ_UP_INC_HZ[[:space:]]+1' src/main.c
          grep -Eq '#define[[:space:]]+FREQ_DOWN_INC_HZ[[:space:]]+1' src/main.c
          grep -Eq 'heartbeat_led' src/main.c
          grep -Eq 'iv_pump_led' src/main.c
          grep -Eq 'buzzer_led' src/main.c
          grep -Eq 'error_led' src/main.c
          grep -Eq 'sleep_button' src/main.c
          grep -Eq 'freq_up_button' src/main.c
          grep -Eq 'freq_down_button' src/main.c
          grep -Eq 'reset_button' src/main.c
          grep -Eq 'heartbeat' boards/native_posix.overlay
          grep -Eq 'ivpump' boards/native_posix.overlay
          grep -Eq 'buzzer' boards/native_posix.overlay
          grep -Eq 'error' boards/native_posix.overlay
          grep -Eq 'sleepbutton' boards/native_posix.overlay
          grep -Eq 'frequpbutton' boards/native_posix.overlay
          grep -Eq 'freqdownbutton' boards/native_posix.overlay
          grep -Eq 'resetbutton' boards/native_posix.overlay
      
      - name: Build for native_sim
        run: |
          cd gpio_lab
          west build -b native_sim -- \
            -DEXTRA_CONF_FILE=sim.prj.conf
      
      - name: Build tests for native_sim
        run: |
          cd gpio_lab
          west build -b native_sim --build-dir=build_test -- \
            -DDTC_OVERLAY_FILE=boards/native_sim.overlay \
            -DEXTRA_CONF_FILE=test.prj.conf \
            -DTEST_BUILD=ON
      
      - name: Run unit tests
        run: |
          cd gpio_lab
          chmod +x build_test/zephyr/zephyr.exe
          build_test/zephyr/zephyr.exe | tee test_output.log
          
      - name: Check test results
        run: |
          cd gpio_lab
          cat test_output.log
          if grep -q "PROJECT EXECUTION SUCCESSFUL" test_output.log; then
            echo "All tests passed!"
            exit 0
          elif grep -q "PROJECT EXECUTION FAILED" test_output.log; then
            echo "Tests failed!"
            exit 1
          else
            echo "Could not determine test status"
            exit 1
          fi
