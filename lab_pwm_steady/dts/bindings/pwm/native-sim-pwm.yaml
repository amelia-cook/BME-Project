# File: dts/bindings/pwm/native-sim-pwm.yaml
description: "Simulated PWM controller for native_sim"
compatible: "zephyr,native-sim-pwm"
# Each PWM spec has 3 cells: <index period polarity>
# index: PWM channel number
# period: PWM period in nanoseconds
# polarity: 0 = normal, 1 = inverted
pwm-cells:
  - index
  - period
  - polarity